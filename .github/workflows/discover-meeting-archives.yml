name: Discover meeting archives

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/discover_meeting_archives.py
      - .github/workflows/discover-meeting-archives.yml

permissions:
  contents: write

concurrency:
  group: meeting-archive-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Format and syntax-check archive discovery
        run: |
          python -m ruff format scripts/discover_meeting_archives.py
          python -m py_compile scripts/discover_meeting_archives.py
      - name: Discover meeting archives for current registry
        run: >-
          python scripts/discover_meeting_archives.py
          --registry research/municipalities.csv
          --audit research/meeting-archive-discovery.json
          --concurrency 24
          --max-candidates 8
      - name: Upload archive discovery audit
        uses: actions/upload-artifact@v4
        with:
          name: meeting-archive-discovery
          path: |
            research/municipalities.csv
            research/meeting-archive-discovery.json
          retention-days: 90
      - name: Commit discovered archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/discover_meeting_archives.py research/municipalities.csv research/meeting-archive-discovery.json
          if git diff --cached --quiet; then
            echo "Archive discovery produced no repository changes."
            exit 0
          fi
          git commit -m "Populate municipality meeting archives"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
