name: Streamlit preview
on:
  push:
    branches: [codex/kommun-region-interface, main]
    paths: ['streamlit_app.py', '.streamlit/**', '.github/workflows/interface-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ".[ui]" playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture interface
        run: |
          python -m streamlit run streamlit_app.py --server.headless true > /tmp/streamlit.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          from playwright.sync_api import sync_playwright
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://localhost:8501/_stcore/health')
                  break
              except OSError:
                  time.sleep(1)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1100}, device_scale_factor=1)
              page.goto('http://localhost:8501')
              page.get_by_text('Verklig sökning', exact=True).click()
              page.get_by_role('button', name='Starta sökning', exact=True).wait_for()
              page.get_by_label('Din API-nyckel för OpenAI', exact=True).wait_for()
              page.wait_for_timeout(1500)
              page.screenshot(path='interface-desktop.png', full_page=True)
              page.set_viewport_size({'width': 390, 'height': 844})
              page.screenshot(path='interface-mobile.png', full_page=True)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Streamlit-design-preview
          path: interface-*.png
