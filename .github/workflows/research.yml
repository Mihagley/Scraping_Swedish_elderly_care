name: Research pilot

on:
  push:
    paths:
      - research/request.json
  workflow_dispatch:
    inputs:
      mode:
        description: Collect sources only, or classify sources using the API secret
        required: true
        default: collect
        type: choice
        options: [collect, classify]

permissions:
  contents: write

concurrency:
  group: research-pilot
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: research-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: research-cache-${{ runner.os }}-
      - name: Collect or classify the bounded pilot
        id: research
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_MODE: ${{ inputs.mode }}
        run: python scripts/run_research.py
      - name: Keep complete run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/results/
            research/latest.json
            research/STATUS.md
          if-no-files-found: warn
          retention-days: 90
      - name: Store research data in the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- research/results research/latest.json research/STATUS.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Store research pilot $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Report processing failure
        if: steps.research.outcome == 'failure'
        run: exit 1
