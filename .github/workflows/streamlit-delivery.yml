name: Streamlit delivery
on:
  push:
    branches: [codex/kommun-region-interface, main]
    paths: ['scripts/build_streamlit_delivery.py', '.github/workflows/streamlit-delivery.yml', 'src/**', 'streamlit_app.py', '.streamlit/**', 'examples/**', 'docs/**', '*.pdf', 'requirements*', 'pyproject.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python scripts/build_streamlit_delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: Utredningsstodet-Streamlit-budgetar
          path: delivery/Utredningsstodet/
          retention-days: 30
