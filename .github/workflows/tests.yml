name: Tests
on:
  push:
    paths-ignore: ['research/results/**', 'research/latest.json', 'research/STATUS.md']
  pull_request:
    paths-ignore: ['research/results/**', 'research/latest.json', 'research/STATUS.md']
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  superseded:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const branch = context.payload.pull_request?.head.ref || context.ref.replace('refs/heads/', '');
            const sha = context.payload.pull_request?.head.sha || context.sha;
            const result = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo, branch, per_page: 100
            });
            const current = result.data.workflow_runs.find(run => run.id === context.runId);
            for (const run of result.data.workflow_runs) {
              if (current && run.created_at < current.created_at &&
                  run.name === 'Tests' && run.id !== context.runId && run.head_sha !== sha &&
                  ['queued', 'in_progress', 'waiting', 'pending'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: run.id
                }).catch(error => core.info('Superseded run already finished: ' + run.id));
              }
            }
  test:
    needs: superseded
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -e ".[ui]"
      - run: python -m pytest --cov=municipal_research --cov-report=term-missing
      - run: municipal-research demo --run-dir runs/ci-demo
      - run: municipal-research verify-run runs/ci-demo


  style:
    needs: superseded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.8
      - run: python -m ruff format --check --diff .
      - run: python -m ruff check .
