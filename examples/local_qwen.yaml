research:
  question: Vilka uttryckliga språkkrav gäller för personal som är anställd av den valda kommunen eller regionen?
  instructions: >-
    Svara på svenska. Hänför varje fynd till den valda organisationen och dess angivna ansvar.
    En region och en kommun är skilda arbetsgivare även om de har samma namn.
    Skilj formella krav från allmänna förväntningar, förslag och utbildning.
    Förutsätt inte att regionen ansvarar för kommunal äldreomsorg.
  unknown_label: Oklart
  labels:
    Fynd:
      definition: Källan besvarar uttryckligen utredningsfrågan för den valda organisationen.
    Oklart:
      definition: Det hämtade materialet ger inget belagt svar. Det bevisar inte att en företeelse saknas.
      requires_evidence: false
      conclusive: false
discovery:
  provider: crawl
  queries: ['{location} {question}']
  keywords: [språkkrav, språktest, personal]
  max_documents: 5
extraction:
  chunk_chars: 3000
  overlap_chars: 300
llm:
  provider: ollama
  models: [qwen3.5:9b]
  verifier_model: qwen3.5:9b
  adjudicator_model: qwen3.5:9b
  ollama_base_url: http://127.0.0.1:11434
  ollama_num_ctx: 16384
  ollama_think: false
  max_output_tokens: 2000
  input_tokens: 12000
  timeout_seconds: 120
  max_calls: 50
